name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Work out version
        id: version
        shell: bash
        run: |
          # Tag v1.2.3 -> 1.2.3.0; anything else -> 1.0.0.<run number>
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            IFS=. read -r a b c d <<< "$v"
            v="${a:-1}.${b:-0}.${c:-0}.${d:-0}"
          else
            v="1.0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Build
        run: >
          dotnet publish Jellyfin.Plugin.Wizarr/Jellyfin.Plugin.Wizarr.csproj
          -c Release -o dist
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}

      - name: Package
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p "package/WizarrInvites_${v}"
          cp dist/Jellyfin.Plugin.Wizarr.dll "package/WizarrInvites_${v}/"
          (cd package && zip -r "../wizarr-invites_${v}.zip" .)
          ls -la dist package

      - uses: actions/upload-artifact@v4
        with:
          name: wizarr-invites_${{ steps.version.outputs.version }}
          path: package/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wizarr-invites_${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
