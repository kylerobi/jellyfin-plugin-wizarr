name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "9.0.x"

      - name: Work out version
        id: version
        shell: bash
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Tag v1.2.3 -> 1.2.3.0; anything else -> 1.0.0.<run number>
          if [[ "$REF" == refs/tags/v* ]]; then
            v="${REF#refs/tags/v}"
            if [[ ! "$v" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
              echo "::error::Tag must look like v1.2.3 (digits and dots only), got: $v"
              exit 1
            fi
            IFS=. read -r a b c d <<< "$v"
            v="${a:-1}.${b:-0}.${c:-0}.${d:-0}"
          else
            v="1.0.0.${RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet publish Jellyfin.Plugin.Wizarr/Jellyfin.Plugin.Wizarr.csproj
          -c Release -o dist
          -p:AssemblyVersion="$VERSION"
          -p:FileVersion="$VERSION"

      # The DLL sits at the top of the zip: Jellyfin's plugin installer extracts it into its own folder.
      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p package
          cp dist/Jellyfin.Plugin.Wizarr.dll package/
          (cd package && zip -X "../wizarr-invites_${VERSION}.zip" Jellyfin.Plugin.Wizarr.dll)
          unzip -l "wizarr-invites_${VERSION}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wizarr-invites_${{ steps.version.outputs.version }}
          path: package/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-zip
          path: wizarr-invites_${{ steps.version.outputs.version }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job can publish releases and update manifest.json
    env:
      TARGET_ABI: "10.11.0.0"   # keep in step with the Jellyfin.Controller version in the .csproj
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: wizarr-invites_${{ needs.build.outputs.version }}.zip
          generate_release_notes: true

      # Adds this release to the plugin repository manifest that Jellyfin reads
      # (Dashboard -> Plugins -> Repositories) and commits it to main.
      - name: Update manifest.json
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          zip="wizarr-invites_${VERSION}.zip"
          python3 -I scripts/update_manifest.py manifest.json \
            --version "$VERSION" \
            --zip "$zip" \
            --url "https://github.com/${REPO}/releases/download/${TAG}/${zip}" \
            --target-abi "$TARGET_ABI" \
            --changelog "See https://github.com/${REPO}/releases/tag/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: add ${VERSION}"
          git push origin HEAD:main
